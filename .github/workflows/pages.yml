name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Create optional online ranking config
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          supabase_url = os.environ.get("SUPABASE_URL")
          anon_key = os.environ.get("SUPABASE_ANON_KEY")
          if not supabase_url or not anon_key:
              print("No Supabase secrets configured; online ranking stays disabled.")
              raise SystemExit(0)

          config = {
              "supabaseUrl": supabase_url,
              "anonKey": anon_key,
              "table": os.environ.get("SUPABASE_TABLE") or "bounce_up_runs",
              "playerName": os.environ.get("BOUNCE_PLAYER_NAME") or "익명",
          }
          Path("config.js").write_text(
              "window.BOUNCE_UP_ONLINE = " + json.dumps(config, ensure_ascii=False) + ";\n",
              encoding="utf-8",
          )
          PY
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_TABLE: ${{ vars.SUPABASE_TABLE }}
          BOUNCE_PLAYER_NAME: ${{ vars.BOUNCE_PLAYER_NAME }}
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
